        // Web Audio Synthesizer
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (isSoundMuted) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(110, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'reveal') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(350, now);
                osc.frequency.exponentialRampToValueAtTime(700, now + 0.12);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                osc.start(now);
                osc.stop(now + 0.12);
            }
        }

                            <button onclick="selectOption(${q.id}, '${opt.key}')" 
                                    id="btn-${q.id}-${opt.key}"
                                    class="option-btn text-left p-4 rounded-2xl border border-slate-200 dark:border-slate-800/80 hover:border-royal-500/50 bg-slate-50/60 dark:bg-slate-900/50 hover:bg-royal-50 dark:hover:bg-royal-950/40 transition-all flex items-center justify-between font-medium text-slate-700 dark:text-slate-200 group/btn">
                                <span class="flex items-center gap-3">
                                    <span class="w-7 h-7 rounded-lg bg-slate-200 dark:bg-slate-800 group-hover/btn:bg-royal-600 group-hover/btn:text-white flex items-center justify-center text-xs font-bold transition-colors">
                                        ${opt.key}
                                    </span>
                                    <span>${opt.text}</span>
                                </span>
                                <span class="status-icon"></span>
                            </button>
                        `).join('')}
                    </div>

                    <!-- Answer & Explanation Reveal Container -->
                    <div id="answerBox-${q.id}" class="hidden mt-4 pt-4 border-t border-slate-200 dark:border-slate-800/80 animate-pop">
                        <!-- Congratulatory Header Banner (Appears on Correct Selection) -->
                        <div id="congratMessage-${q.id}" class="hidden mb-3 p-3 rounded-xl bg-emerald-500/15 border border-emerald-500/30 text-emerald-800 dark:text-emerald-300 font-bold text-sm flex items-center gap-2 animate-celebrate">
                            <span class="text-lg">🎉</span>
                            <span>অভিনন্দন! আপনার উত্তর সঠিক হয়েছে!</span>
                        </div>

                        <!-- Answer & Explanation Card -->
                        <div class="bg-gradient-to-r from-royal-500/10 via-indigo-500/10 to-teal-500/10 border border-royal-500/30 rounded-2xl p-4 text-slate-800 dark:text-slate-200">
                            <div class="flex items-center gap-2 font-bold mb-1.5 text-royal-700 dark:text-royal-300 text-base">
                                <svg class="w-5 h-5 text-emerald-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                </svg>
                                <span>সঠিক উত্তর: ${q.correctKey}. ${q.correctAnswerText}</span>
                            </div>
                            <p class="text-sm mt-1 text-slate-600 dark:text-slate-300 leading-relaxed pl-7">
                                <span class="font-bold text-slate-800 dark:text-slate-100">ব্যাখ্যা:</span> ${q.explanation}
                            </p>
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function selectOption(qId, selectedKey) {
            const question = quizData.find(q => q.id === qId);
            if (!question) return;

            const isAlreadyAnswered = answeredQuestions.has(qId);
            
            // Disable option buttons for this question
            const optionsGroup = document.getElementById(`optionsGroup-${qId}`);
            const buttons = optionsGroup.querySelectorAll('.option-btn');
            
            buttons.forEach(btn => {
                btn.disabled = true;
                btn.classList.add('cursor-not-allowed', 'opacity-80');
            });

            const selectedBtn = document.getElementById(`btn-${qId}-${selectedKey}`);
            const correctBtn = document.getElementById(`btn-${qId}-${question.correctKey}`);
            const congratBanner = document.getElementById(`congratMessage-${qId}`);

            if (selectedKey === question.correctKey) {
                // Correct Answer Logic
                selectedBtn.classList.remove('bg-slate-50/60', 'dark:bg-slate-900/50', 'border-slate-200', 'dark:border-slate-800/80');
                selectedBtn.classList.add('bg-emerald-500/20', 'border-emerald-500', 'text-emerald-700', 'dark:text-emerald-300', 'font-bold');
                selectedBtn.querySelector('.status-icon').innerHTML = `
                    <svg class="w-6 h-6 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                `;
                
                // Show congratulatory banner
                if (congratBanner) congratBanner.classList.remove('hidden');

                if (!isAlreadyAnswered) {
                    score++;
                    playSound('correct');
                    
                    // Trigger minor festive burst ONLY on correct answer
                    if (typeof confetti === 'function') {
                        confetti({
                            particleCount: 40,
                            spread: 50,
                            origin: { y: 0.7 }
                        });
                    }
                }
            } else {
                // Wrong Answer Logic (NO celebration/confetti)
                selectedBtn.classList.remove('bg-slate-50/60', 'dark:bg-slate-900/50');
                selectedBtn.classList.add('bg-rose-500/20', 'border-rose-500', 'text-rose-700', 'dark:text-rose-300', 'animate-shake');
                selectedBtn.querySelector('.status-icon').innerHTML = `
                    <svg class="w-6 h-6 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                `;

                // Highlight Correct Option quietly
                correctBtn.classList.add('bg-emerald-500/10', 'border-emerald-500/50');
                
                if (!isAlreadyAnswered) {
                    playSound('wrong');
                }
            }

            if (!isAlreadyAnswered) {
                answeredQuestions.add(qId);
                answeredCount++;
                updateProgress();
            }

            // ALWAYS reveal explanation regardless of right or wrong selection
            revealAnswerBox(qId);
        }

        function revealAnswerBox(qId) {
            const answerBox = document.getElementById(`answerBox-${qId}`);
            const revealBtn = document.getElementById(`revealBtn-${qId}`);

            if (answerBox.classList.contains('hidden')) {
                answerBox.classList.remove('hidden');
                revealBtn.classList.add('rotate-45', 'from-emerald-500', 'to-teal-600');
                revealBtn.title = "উত্তর লুকান";
            }
        }

        function toggleAnswer(qId, triggerSound = true) {
            const answerBox = document.getElementById(`answerBox-${qId}`);
            const revealBtn = document.getElementById(`revealBtn-${qId}`);

            if (answerBox.classList.contains('hidden')) {
                answerBox.classList.remove('hidden');
                revealBtn.classList.add('rotate-45', 'from-emerald-500', 'to-teal-600');
                revealBtn.title = "উত্তর লুকান";
                if (triggerSound) playSound('reveal');
            } else if (triggerSound) {
                answerBox.classList.add('hidden');
                revealBtn.classList.remove('rotate-45', 'from-emerald-500', 'to-teal-600');
                revealBtn.title = "উত্তর ও ব্যাখ্যা দেখুন";
                playSound('click');
            }
        }

        function updateProgress() {
            document.getElementById('scoreCounter').innerText = score;
            const progressPercent = (answeredCount / quizData.length) * 100;
            document.getElementById('progressBar').style.width = `${progressPercent}%`;

            if (answeredCount === quizData.length) {
                setTimeout(() => {
                    document.getElementById('finalScore').innerText = `${score} / ${quizData.length}`;
                    document.getElementById('completionCard').classList.remove('hidden');
                }, 500);
            }
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            playSound('click');
        }

        function toggleSound() {
            isSoundMuted = !isSoundMuted;
            document.getElementById('soundIconOn').classList.toggle('hidden', isSoundMuted);
            document.getElementById('soundIconOff').classList.toggle('hidden', !isSoundMuted);
        }

        function resetQuiz() {
            score = 0;
            answeredCount = 0;
            answeredQuestions.clear();
            document.getElementById('completionCard').classList.add('hidden');
            document.getElementById('progressBar').style.width = '0%';
            renderQuiz();
            playSound('click');
        }

        window.onload = function() {
            renderQuiz();
        };
    </script>
</body>
</html>
